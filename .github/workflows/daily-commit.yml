name: Daily Auto Commit

on:
  schedule:
    # Jalankan setiap hari pukul 08:00 UTC (15:00 WIB)
    - cron: '0 8 * * *'
  # Manual trigger untuk testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no push)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    # Timeout untuk mencegah workflow hanging
    timeout-minutes: 10

    steps:
      # 1. Checkout dengan full history untuk better commit tracking
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history
          persist-credentials: false  # Pakai token khusus

      # 2. Setup Git dengan konfigurasi yang tepat
      - name: Setup Git configuration
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global pull.rebase false

      # 3. Fetch latest changes dari remote
      - name: Fetch latest changes
        run: |
          git fetch origin
          # Cek apakah current branch behind remote
          git log --oneline -n 5

      # 4. Lakukan perubahan yang diperlukan
      - name: Generate updates
        run: |
          # Update timestamp
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_update.txt
          
          # Optional: Update commit count atau stats
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Total commits: $COMMIT_COUNT" > .github/stats/commits.txt 2>/dev/null || true
          
          # Optional: Create/update a daily log
          mkdir -p .github/logs
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Automated daily update" >> .github/logs/daily.log

      # 5. Check dan commit changes
      - name: Commit changes
        id: commit
        run: |
          # Staging changes
          git add .
          
          # Check apakah ada changes yang staged
          if git diff --cached --quiet; then
            echo "status=no-changes" >> $GITHUB_OUTPUT
            echo "✓ No changes to commit"
            exit 0
          fi
          
          # Get current date untuk commit message
          COMMIT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG="chore(automation): daily update [${COMMIT_DATE}]"
          
          git commit -m "$COMMIT_MSG" -m "Automated commit generated by GitHub Actions"
          echo "status=committed" >> $GITHUB_OUTPUT
          echo "✓ Changes committed successfully"
          
          # Log commit info
          git log --oneline -n 1

      # 6. Pull latest changes sebelum push (handle concurrency)
      - name: Sync with remote
        if: steps.commit.outputs.status == 'committed'
        run: |
          echo "Syncing with remote repository..."
          git pull origin ${{ github.ref_name }} --rebase
          echo "✓ Successfully synced"

      # 7. Push changes (skip jika dry-run)
      - name: Push changes
        if: steps.commit.outputs.status == 'committed' && github.event.inputs.dry_run != 'true'
        run: |
          # Gunakan GITHUB_TOKEN untuk autentikasi
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          echo "✓ Changes pushed successfully"

      # 8. Dry-run notification
      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true' && steps.commit.outputs.status == 'committed'
        run: |
          echo "📋 DRY-RUN MODE: Changes prepared but NOT pushed"
          echo "---"
          git log --oneline -n 1
          echo "---"
          git diff HEAD~1

      # 9. Failure notification
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Auto-commit workflow failed"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"