name: Daily Auto Commit

on:
  schedule:
    # Jalankan 10 kali sehari dengan interval tertentu
    - cron: '0 0 * * *'   # 00:00 UTC (07:00 WIB)
    - cron: '0 2 * * *'   # 02:00 UTC (09:00 WIB)
    - cron: '0 4 * * *'   # 04:00 UTC (11:00 WIB)
    - cron: '0 6 * * *'   # 06:00 UTC (13:00 WIB)
    - cron: '0 8 * * *'   # 08:00 UTC (15:00 WIB)
    - cron: '0 10 * * *'  # 10:00 UTC (17:00 WIB)
    - cron: '0 12 * * *'  # 12:00 UTC (19:00 WIB)
    - cron: '0 14 * * *'  # 14:00 UTC (21:00 WIB)
    - cron: '0 16 * * *'  # 16:00 UTC (23:00 WIB)
    - cron: '0 18 * * *'  # 18:00 UTC (01:00 WIB hari berikutnya)

  # Manual trigger tetap ada untuk testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no push)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

# Prevent overlapping runs from racing on the same timestamp file
concurrency:
  group: daily-auto-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    # Timeout untuk mencegah workflow hanging
    timeout-minutes: 10

    steps:
      # 1. Checkout dengan full history untuk better commit tracking
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history
          token: ${{ secrets.GITHUB_TOKEN }}
          # persist-credentials must stay true (default) so fetch/pull/push authenticate

      # 2. Setup Git dengan konfigurasi yang tepat
      - name: Setup Git configuration
        run: |
          git config user.name 'Jordan Theovandy'
          git config user.email 'jordantheovandyferdinand@gmail.com'
          git config pull.rebase true

      # 3. Sync with remote BEFORE making changes (avoid rebase conflicts after commit)
      - name: Sync with remote
        run: |
          git fetch origin
          git pull origin "${{ github.ref_name }}" --rebase --autostash || {
            echo "No upstream to rebase against yet (fresh branch?), continuing..."
          }
          git log --oneline -n 5

      # 4. Lakukan perubahan yang diperlukan
      - name: Generate updates
        run: |
          # Update timestamp (this file MUST NOT be gitignored, otherwise every run is a no-op)
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_update.txt

          # Update commit count / stats (mkdir first, otherwise redirect silently fails)
          mkdir -p .github/stats
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Total commits: $COMMIT_COUNT" > .github/stats/commits.txt

          # Create/update a daily log (this file MUST NOT be gitignored either)
          mkdir -p .github/logs
          echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Automated daily update" >> .github/logs/daily.log

          echo "--- git status after generate ---"
          git status --porcelain

      # 5. Check dan commit changes
      - name: Commit changes
        id: commit
        run: |
          # Staging changes (both files above must be trackable - check .gitignore!)
          git add last_update.txt .github/logs/daily.log .github/stats/commits.txt

          # Check apakah ada changes yang staged
          if git diff --cached --quiet; then
            echo "status=no-changes" >> "$GITHUB_OUTPUT"
            echo "✓ No changes to commit"
            exit 0
          fi

          # Get current date untuk commit message
          COMMIT_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_MSG="chore(automation): daily update [${COMMIT_DATE}]"

          git commit -m "$COMMIT_MSG" -m "Automated commit generated by GitHub Actions"
          echo "status=committed" >> "$GITHUB_OUTPUT"
          echo "✓ Changes committed successfully"

          # Log commit info
          git log --oneline -n 1

      # 6. Push changes with retry (skip jika dry-run / no changes)
      - name: Push changes
        if: steps.commit.outputs.status == 'committed' && github.event.inputs.dry_run != 'true'
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="$(git branch --show-current)"
          fi
          echo "Pushing to branch: $BRANCH"

          # Retry up to 3x: pull --rebase then push (handles race between 2-hour slots)
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "✓ Changes pushed successfully (attempt $i)"
              exit 0
            fi
            echo "⚠ Push failed (attempt $i), rebasing and retrying..."
            git fetch origin
            git pull origin "$BRANCH" --rebase --autostash || true
            sleep 5
          done

          echo "❌ Push failed after 3 attempts"
          exit 1

      # 7. Dry-run notification
      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true' && steps.commit.outputs.status == 'committed'
        run: |
          echo "📋 DRY-RUN MODE: Changes prepared but NOT pushed"
          echo "---"
          git log --oneline -n 1
          echo "---"
          git diff HEAD~1 || true

      # 8. Failure notification
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Auto-commit workflow failed"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
